name: Lint
on:
  workflow_call:
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: '1.97.1'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy --no-self-update
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: |
          export PYO3_PYTHON="$(command -v python)"
          cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Python and C formatting
        run: |
          python -m pip install ruff==0.15.17 clang-format==22.1.5
          ruff check crates/binding-python tools/ci.py
          ruff format --check crates/binding-python tools/ci.py
          git ls-files -z 'crates/binding-c/*.c' 'crates/binding-c/*.h' | xargs -0 -r clang-format --dry-run --Werror
