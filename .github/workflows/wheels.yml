name: Release artifacts (manual publishing only)
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  versions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: python -m pip install packaging==25.0 tomli==2.2.1
      - name: Check tag and component versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/ci.py versions --tag "$RELEASE_TAG"
  lint:
    needs: versions
    uses: ./.github/workflows/lint.yml
  tests:
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15]
    uses: ./.github/workflows/tests.yml
    with:
      runner: ${{ matrix.runner }}
  build:
    needs: [lint, tests]
    uses: ./.github/workflows/wheels-build.yml
