name: CI
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  lint:
    uses: ./.github/workflows/lint.yml
  tests:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-2022, macos-15]
    uses: ./.github/workflows/tests.yml
    with:
      runner: ${{ matrix.runner }}
