[package]
name = "cqlib-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The high-performance core foundation for the CQLib quantum computing ecosystem."
authors = ["Cqlib Development Team <tianyan@chinatelecom.cn >"]
homepage = "https://qc.zdxlz.com/"
repository = "https://gitee.com/cq-lib/cqlib"
documentation = "https://docs.rs/cqlib-core"
readme = "README.md"
keywords = [
    "quantum",
    "quantum_circuit",
    "quantum_computing",
    "quantum_programming",
    "physics",
]
categories = [
    "science",
    "simulation",
    "algorithms",
    "science::physics",
    "data-structures"
]
include = [
    "src/**/*.rs",
    "src/compile/knowledge/rule_dsl/*.rule",
    "Cargo.toml",
    "README.md",
]


[dependencies]
approx.workspace = true
bitvec.workspace = true
faer.workspace = true
lalrpop-util = { workspace = true, features = ["lexer"] }
lazy_static.workspace = true
indexmap.workspace = true
ndarray.workspace = true
num.workspace = true
num-complex.workspace = true
oq3_semantics.workspace = true
rayon.workspace = true
rand.workspace = true
regex.workspace = true
rustworkx-core.workspace = true
smallvec.workspace = true
symb_anafis.workspace = true
serde.workspace = true
serde_json.workspace = true
resvg = "0.45"
thiserror.workspace = true
time.workspace = true
uuid.workspace = true

[build-dependencies]
lalrpop.workspace = true

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true

[[bench]]
name = "two_qubit_synthesis_cache"
harness = false

[[bench]]
name = "knowledge_rewrite_incremental"
harness = false
